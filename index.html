<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Smart Library Scanner</title>

<script src="https://unpkg.com/html5-qrcode"></script>

<style>
body{
    margin:0;
    font-family: Arial, Helvetica, sans-serif;
    background: linear-gradient(135deg,#1e3c72,#2a5298);
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
}

.container{
    background:white;
    padding:25px;
    border-radius:16px;
    width:90%;
    max-width:420px;
    text-align:center;
    box-shadow:0 10px 25px rgba(0,0,0,0.3);
}

h2{ color:#2a5298; }

input{
    padding:8px;
    width:70%;
    margin-top:10px;
}

button{
    padding:8px 12px;
    margin-left:5px;
    background:#2a5298;
    color:white;
    border:none;
    border-radius:6px;
}

#reader{ margin-top:20px; }

.status{
    margin-top:15px;
    font-weight:bold;
}
</style>
</head>

<body>

<div class="container">
    <h2>Smart Library Scanner</h2>

    <div>
        <input id="ipInput" placeholder="Pico IP or pico.local">
        <button onclick="saveIP()">Save</button>
    </div>

    <div id="reader"></div>
    <div id="status" class="status">Waiting for scan...</div>
</div>

<script>
let pico_ip = localStorage.getItem("pico_ip") || "pico.local";
document.getElementById("ipInput").value = pico_ip;

function saveIP(){
    pico_ip = document.getElementById("ipInput").value;
    localStorage.setItem("pico_ip", pico_ip);
}

function onScanSuccess(decodedText){
    document.getElementById("status").innerHTML =
        "Scanned: " + decodedText;

    fetch("http://" + pico_ip + "/scan?code=" + decodedText);
}

let scanner = new Html5QrcodeScanner("reader",{fps:10,qrbox:250});
scanner.render(onScanSuccess);
</script>

</body>
</html>
