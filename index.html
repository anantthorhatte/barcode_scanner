<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Smart Library Scanner</title>

<script src="https://unpkg.com/html5-qrcode"></script>

<style>
body{
    margin:0;
    font-family: Arial, Helvetica, sans-serif;
    background: linear-gradient(135deg,#1e3c72,#2a5298);
    color:white;
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
}

.container{
    background:white;
    color:#333;
    padding:25px;
    border-radius:16px;
    width:90%;
    max-width:420px;
    text-align:center;
    box-shadow:0 10px 25px rgba(0,0,0,0.3);
}

h2{
    margin-bottom:10px;
    color:#2a5298;
}

.subtitle{
    font-size:14px;
    margin-bottom:20px;
    color:#666;
}

#reader{
    width:100%;
    margin:auto;
}

.status{
    margin-top:15px;
    font-weight:bold;
    color:#1e3c72;
}

.footer{
    margin-top:15px;
    font-size:12px;
    color:#888;
}
</style>
</head>

<body>

<div class="container">
    <h2>Smart Library Scanner</h2>
    <div class="subtitle">Scan the book barcode</div>

    <div id="reader"></div>

    <div id="status" class="status">Waiting for scan...</div>
    <div class="footer">Library Management System</div>
</div>

<script>
const pico_ip = "192.168.1.45";   // CHANGE to your Pico IP

function onScanSuccess(decodedText) {

    document.getElementById("status").innerHTML =
        "Scanned: " + decodedText;

    fetch("http://" + pico_ip + "/scan?code=" + decodedText);

}

let scanner = new Html5QrcodeScanner(
    "reader",
    { fps: 10, qrbox: 250 }
);

scanner.render(onScanSuccess);
</script>

</body>
</html>
