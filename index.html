<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Smart Library Scanner</title>

<script src="https://unpkg.com/html5-qrcode"></script>

<style>
body{
    margin:0;
    font-family: Arial, Helvetica, sans-serif;
    background: linear-gradient(135deg,#1e3c72,#2a5298);
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
}

.container{
    background:white;
    padding:25px;
    border-radius:16px;
    width:90%;
    max-width:420px;
    text-align:center;
}

h2{ color:#2a5298; }

#reader{ margin-top:20px; }

.status{
    margin-top:15px;
    font-weight:bold;
}
</style>
</head>

<body>

<div class="container">
    <h2>Smart Library Scanner</h2>
    <div id="reader"></div>
    <div id="status" class="status">Waiting for scan...</div>
</div>

<script>

const pico_ip = "10.82.16.254";   // YOUR PICO IP

function onScanSuccess(decodedText) {

    document.getElementById("status").innerHTML =
        "Scanned: " + decodedText;

    fetch("http://" + pico_ip + "/scan?code=" + decodedText);
}

let scanner = new Html5QrcodeScanner(
    "reader",
    { fps: 10, qrbox: 250 }
);

scanner.render(onScanSuccess);

</script>

</body>
</html>
